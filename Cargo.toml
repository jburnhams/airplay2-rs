[package]
name = "airplay2"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Your Name <email@example.com>"]
description = "Pure Rust library for streaming audio to AirPlay 2 devices"
license = "MIT OR Apache-2.0"
repository = "https://github.com/org/airplay2-rs"
keywords = ["airplay", "audio", "streaming", "homekit", "multiroom"]
categories = ["multimedia::audio", "network-programming"]
readme = "README.md"

[features]
default = ["tokio-runtime", "raop"]
tokio-runtime = ["tokio"]
raop = ["rsa", "sha1"]
receiver = []
audio-coreaudio = ["dep:coreaudio-rs"]
audio-cpal = ["dep:cpal"]
audio-alsa = ["dep:alsa"]
receiver-full = ["receiver", "audio-coreaudio", "audio-cpal"]
decoders = ["dep:symphonia"]

[dependencies]
cpal = { version = "0.18.2", optional = true, default-features = false }
bytes = "1.12.2"

# Async
tokio = { version = "1.54", features = ["net", "sync", "time", "rt", "macros", "fs"], optional = true }
async-trait = "0.1"
futures = "0.3"
socket2 = { version = "0.6", features = ["all"] }

# Error handling
thiserror = "2.0"

# Logging
tracing = "0.1"

# Discovery
mdns-sd = "0.22"
hostname = "0.4"

# Crypto
rsa = { version = "0.10.0-rc.19", optional = true }
sha1 = { version = "0.11.0", features = ["oid"], optional = true }
base64 = "0.23"
num-bigint = "0.5"
num-traits = "0.2"
byteorder = "1.5"
x25519-dalek = { version = "3.0", features = ["static_secrets"] }
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
chacha20poly1305 = "0.11.0"
aes-gcm = "0.11.1"
aes = "0.9"
ctr = "0.10"
hkdf = "0.13.0"
sha2 = "0.11.0"
rand = "0.10"
rand_core_10 = { package = "rand_core", version = "0.10.1" }
crypto-bigint = "0.7.0-rc.28"
curve25519-dalek = "5.0"
zeroize = "1.9"

# Serialization
# bytes = "1.9" # Already defined above

# Audio processing
alac-encoder = "0.3"      # ALAC encoding

# Persistent storage (optional)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
fdk-aac = "0.8.0"
# Pinned: 0.6 rewrote the decoding API and src/streaming/file.rs is due for a rewrite anyway (audit 2026-11-25).
symphonia = { version = "0.5.5", optional = true, features = ["mp3", "aac", "alac", "pcm", "isomp4"] }
hex = "0.4.3"
portpicker = "0.1.1"

[target.'cfg(target_os = "linux")'.dependencies]
# Pinned to the alsa version cpal uses: both link libasound, so only one alsa-sys may exist.
alsa = { version = "0.11", optional = true }

[dev-dependencies]
tokio = { version = "1.54", features = ["full", "test-util"] }
tokio-test = "0.4"
proptest = "1.11"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
criterion = { version = "0.7", features = ["async_tokio"] }
tempfile = "3.27.0"
# Integration test dependencies
nix = { version = "0.32", features = ["signal"] }
portpicker = "0.1.1"
hex = "0.4.3"

[[bench]]
name = "protocol_benchmarks"
harness = false

[[bench]]
name = "raop_benchmarks"
harness = false

[[bench]]
name = "receiver_benchmarks"
harness = false

[[bench]]
name = "convert_benchmarks"
harness = false

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = { version = "0.14", optional = true }
[workspace]
members = ["integration_tests"]

[[bench]]
name = "streaming_benchmarks"
harness = false
