name: Fuzz

# Differential fuzzing against C reference implementations (see fuzz/README.md).
# Short runs on PRs that touch the code under test, longer runs weekly.

on:
  pull_request:
    paths:
      - "src/protocol/plist/**"
      - "src/protocol/pairing/tlv.rs"
      - "src/protocol/raop/**"
      - "src/protocol/sdp/**"
      - "src/streaming/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - plist_vs_libplist
          - tlv8_vs_pair_ap
          - raop_audio_vs_shairport
          - alac_vs_shairport
    env:
      SECONDS_PER_TARGET: ${{ github.event_name == 'schedule' && 1800 || 120 }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libasound2-dev
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Seed plist corpus
        if: matrix.target == 'plist_vs_libplist'
        run: mkdir -p fuzz/corpus/plist_vs_libplist && cp tests/fixtures/*.bplist fuzz/corpus/plist_vs_libplist/
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: cargo +nightly fuzz run -O ${{ matrix.target }} -- -max_total_time=$SECONDS_PER_TARGET -rss_limit_mb=4096
      - name: Upload crash
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/
